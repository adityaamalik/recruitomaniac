[project]
name = "recruitomaniac-api"
version = "0.1.0"
description = "Backend API for Recruitomaniac"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# Settings for pytest, the test runner
[tool.pytest.ini_options]
pythonpath = ["."]      # lets tests import main.py from this folder
testpaths = ["tests"]   # where the tests live
